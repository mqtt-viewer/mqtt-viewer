name: Publish Docker image

# Builds and pushes the MQTT Viewer web/server image (see Dockerfile,
# docs/DOCKER.md) to GHCR for linux/amd64 and linux/arm64.
#
# The Go build stage cross-compiles natively via BUILDPLATFORM (Go's own
# cross-compiler, no CGO), so QEMU is only needed for the alpine-based
# runtime stage's RUN steps (apk add, adduser, ...) when targeting arm64 on
# this amd64 runner.
#
# Runs on every published release, and can be triggered manually
# (workflow_dispatch) to push an image from the current branch state for
# testing. Pull requests that touch the image get a build-only job instead:
# no secrets, no registry login, no push.
#
# `:latest` only moves for a full release. Pre-releases publish their version
# tags and nothing else, so a beta never repoints the tag every compose user
# is pinned to.

on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker/**'
      - 'main.go'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-publish.yaml'
  workflow_dispatch:
    inputs:
      version:
        description: "Version string to stamp (e.g. v1.2.3)"
        required: false
        default: "v0.0.0-test"

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mqtt-viewer

jobs:
  # Verification gate for pull requests: proves the Dockerfile still builds
  # after a change to the image, the Go backend or the frontend. amd64 only
  # and no push, so it stays quick.
  build-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Build image (amd64, no push)
    permissions:
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          # A "-dev" version keeps the ldflags stage from demanding the
          # release secrets, which a PR build has no access to.
          build-args: |
            VERSION=0.0.0-dev-pr
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          v="${{ github.event.release.tag_name }}"
          [ -z "$v" ] && v="${{ github.event.inputs.version }}"
          [ -z "$v" ] && v="v0.0.0-test"
          # Strip a leading "v" for the build-arg (env.Version must not
          # contain "-dev"; a bare "v0.0.0-test" would be fine either way,
          # but the stripped form is what's shown in the app).
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "build_version=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.build_version }}
          secrets: |
            machine_id_secret=${{ secrets.MACHINE_ID_SECRET }}
            cloud_username=${{ secrets.CLOUD_USERNAME }}
            cloud_password=${{ secrets.CLOUD_PASSWORD }}
