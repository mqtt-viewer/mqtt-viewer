name: Release MQTT Viewer - Mac

on:
  release:
    types: [published]
  # Re-run just the Mac build for an existing release, after fixing a
  # Mac-only failure, without recreating the tag and rebuilding every
  # platform. Assets are uploaded to the release with --clobber and the
  # portal record is updated in place.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, or a new diagnostic prerelease (e.g. v1.2.1-alpha1)"
        required: true
      test_build:
        description: "Publish an Intel-only diagnostic prerelease without portal registration"
        type: boolean
        default: false

env:
  GO_VERSION: "1.25.x"
  WAILS_VERSION: "v3.0.0-beta.16"
  NODE_VERSION: "22.17.0"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        build: ${{ fromJSON(inputs.test_build && '[{"arch":"amd64","os":"macos-latest","tag":"darwin_amd64"}]' || '[{"arch":"amd64","os":"macos-latest","tag":"darwin_amd64"},{"arch":"arm64","os":"macos-latest","tag":"darwin_arm64"}]') }}
    runs-on: ${{ matrix.build.os }}
    name: Release MQTT Viewer (${{ matrix.build.tag }})
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Set up common, sanitised environment variables

      - name: Normalise version tag
        id: normalise_version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.release.tag_name || inputs.tag }}
          TEST_BUILD: ${{ inputs.test_build }}
        run: |
          version="$REQUESTED_VERSION"
          if [ "$TEST_BUILD" = true ] && ! [[ "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-(alpha|beta|rc)[1-9][0-9]*$ ]]; then
            echo "Diagnostic builds require a tag such as v1.2.1-alpha1" >&2
            exit 1
          fi
          if [ -z "$version" ]; then
            version="v0.0.0"
          fi
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Check diagnostic tag and release are unused
        if: ${{ inputs.test_build }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.normalise_version.outputs.version }}
        run: |
          assert_missing() {
            local response
            if response=$(gh api --include "$1"); then
              echo "Refusing to overwrite existing $1" >&2
              exit 1
            fi
            if [ "$(awk '/^HTTP\// {print $2}' <<< "$response")" != 404 ]; then
              echo "Could not confirm $1 is unused" >&2
              exit 1
            fi
          }
          assert_missing "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION"
          assert_missing "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION"

      - name: Define output filename
        id: define_filename
        shell: bash
        env:
          VERSION: ${{ steps.normalise_version.outputs.version }}
        run: |
          echo "filename=MQTT_Viewer_${VERSION}_${{ matrix.build.tag }}" >> $GITHUB_OUTPUT

      # Set up development dependencies

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install wails3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        shell: bash
        run: npm install -g pnpm@10.28.0

      # Dependencies

      - name: Setup Gon
        run: brew install Bearer/tap/gon

      - name: Import code signing certificate from Github Secrets
        uses: Apple-Actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

      # Build

      - name: Build and package macOS app
        shell: bash
        env:
          VERSION: ${{ steps.normalise_version.outputs.version }}
        run: |
          echo "building app for darwin/${{ matrix.build.arch }}"
          LD_FLAGS="-X mqtt-viewer/backend/env.Version=$VERSION"
          LD_FLAGS="${LD_FLAGS} -X mqtt-viewer/backend/env.MachineIdProtectString=${{ secrets.MACHINE_ID_SECRET }}"
          LD_FLAGS="${LD_FLAGS} -X mqtt-viewer/backend/env.CloudUsername=${{ secrets.CLOUD_USERNAME }}"
          LD_FLAGS="${LD_FLAGS} -X mqtt-viewer/backend/env.CloudPassword=${{ secrets.CLOUD_PASSWORD }}"
          wails3 task darwin:package ARCH=${{ matrix.build.arch }} VERSION="$VERSION" LD_FLAGS="${LD_FLAGS}"

      - name: Sign, zip, notarize macOS app
        shell: bash
        run: |
          echo "Removing ad-hoc signature"
          codesign --remove-signature "./bin/MQTT Viewer.app"
          echo "Signing Package"
          gon -log-level=info ./build/darwin/gon.sign.json
          if [ "$TEST_BUILD" = true ]; then
            codesign --verify --deep --strict "./bin/MQTT Viewer.app"
            binary="./bin/MQTT Viewer.app/Contents/MacOS/mqtt-viewer"
            file "$binary"
            test "$(lipo -archs "$binary")" = x86_64
            build_info=$(xcrun vtool -show-build "$binary")
            echo "$build_info"
            minos=$(awk '$1 == "minos" {print $2}' <<< "$build_info")
            [[ "$minos" = 12.0 || "$minos" = 12.0.0 ]]
            test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' './bin/MQTT Viewer.app/Contents/Info.plist')" = 12.0.0
          fi
          echo "Zipping Package"
          # --norsrc/--noextattr/--noqtn: keep AppleDouble (._*) entries out of
          # the zip. The in-app updater extracts this zip verbatim; stray ._
          # files break the bundle's code signature seal and Gatekeeper then
          # silently refuses to launch the updated app.
          ditto -c -k --norsrc --noextattr --noqtn --keepParent "./bin/MQTT Viewer.app" ./bin/MQTTViewer.zip
          echo "Cleaning up"
          rm -rf "./bin/MQTT Viewer.app"
          echo "Notarizing Zip Files"
          gon -log-level=info ./build/darwin/gon.notarize.json
        env:
          TEST_BUILD: ${{ inputs.test_build }}
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          AC_PROVIDER: ${{ secrets.AC_PROVIDER }}

      # Publish

      - name: Rename release zip and create checksum
        shell: bash
        env:
          FILENAME: ${{ steps.define_filename.outputs.filename }}
        run: |
          mv bin/MQTTViewer.zip "bin/$FILENAME.zip"
          cd bin && shasum -a 256 "$FILENAME.zip" > "$FILENAME.zip.sha256"

      - name: Publish diagnostic prerelease
        if: ${{ inputs.test_build }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.normalise_version.outputs.version }}
          FILENAME: ${{ steps.define_filename.outputs.filename }}
        run: |
          cat > diagnostic-notes.txt <<'EOF'
          Signed and notarised Intel macOS compatibility test for [issue #48](https://github.com/mqtt-viewer/mqtt-viewer/issues/48), intended for testing on macOS 12. This build removes regex lookbehind from hostname validation; whether it resolves the reporter's blank window remains unconfirmed.
          EOF
          # GITHUB_TOKEN publication does not trigger the other release workflows.
          gh release create "$VERSION" "bin/$FILENAME.zip" "bin/$FILENAME.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "MQTT Viewer $VERSION compatibility test" \
            --notes-file diagnostic-notes.txt

      - name: Upload release assets
        if: ${{ !inputs.test_build }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.normalise_version.outputs.version }}
          FILENAME: ${{ steps.define_filename.outputs.filename }}
        run: |
          gh release upload "$VERSION" \
            "bin/$FILENAME.zip" \
            "bin/$FILENAME.zip.sha256" \
            --clobber --repo "${{ github.repository }}"

      # The release body and publish time come from the release itself, so a
      # dispatch run sends the portal the same notes the release event would.
      - name: Read release metadata
        if: ${{ !inputs.test_build }}
        id: release_meta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.normalise_version.outputs.version }}
        run: |
          gh release view "$VERSION" \
            --repo "${{ github.repository }}" --json body,publishedAt > release.json
          {
            echo "published_at=$(jq -r .publishedAt release.json)"
            echo "notes<<NOTES_EOF"
            jq -r .body release.json
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Register the updater artifact with the portal. The record is created
      # with released=false; toggle `released` in the portal admin UI to make
      # it visible to in-app update checks.

      - name: Register release with portal
        if: ${{ !inputs.test_build }}
        shell: bash
        env:
          PORTAL_URL: https://cloud.mqttviewer.app
          CI_RELEASES_USERNAME: ${{ secrets.CI_RELEASES_USERNAME }}
          CI_RELEASES_PASSWORD: ${{ secrets.CI_RELEASES_PASSWORD }}
          RELEASE_NOTES: ${{ steps.release_meta.outputs.notes }}
          PUBLISHED_AT: ${{ steps.release_meta.outputs.published_at }}
          VERSION: ${{ steps.normalise_version.outputs.version }}
          FILENAME: ${{ steps.define_filename.outputs.filename }}
        run: |
          asset="bin/$FILENAME.zip"
          name=$(basename "$asset")
          size=$(wc -c < "$asset" | tr -d ' ')
          sha256=$(cut -d' ' -f1 < "$asset.sha256")
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$name"
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$RELEASE_NOTES" \
            --arg published_at "$PUBLISHED_AT" \
            --arg key "darwin_${{ matrix.build.arch }}" \
            --arg name "$name" --arg url "$url" --arg sha256 "$sha256" --argjson size "$size" \
            '{version: $version, release_notes: $notes, published_at: $published_at,
              artifacts: {($key): {name: $name, url: $url, size: $size, sha256: $sha256}}}' \
            | curl --fail-with-body -u "$CI_RELEASES_USERNAME:$CI_RELEASES_PASSWORD" \
                -H 'Content-Type: application/json' -d @- \
                "$PORTAL_URL/api/cv1/updates/v3/releases"
